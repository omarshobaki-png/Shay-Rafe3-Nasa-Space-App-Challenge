html/export_icon=true
html/head_include="<style>
#rotate-hint{display:none;position:fixed;inset:0;z-index:99;background:#070a1a;color:#ffd75e;font:bold 22px/1.5 sans-serif;align-items:center;justify-content:center;text-align:center;padding:24px}
#rotate-hint small{color:#9aa3cc;font-weight:normal;font-size:15px}
@media (orientation:portrait) and (pointer:coarse){#rotate-hint{display:flex}}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.id='rotate-hint';d.innerHTML='<div><span style=font-size:44px>&#x21BB;</span><br>Turn your phone sideways<br><small>AstroPixel plays in landscape</small></div>';document.body.appendChild(d);});
document.addEventListener('touchend',function first(){document.removeEventListener('touchend',first);var e=document.documentElement;if(!e.requestFullscreen||document.fullscreenElement)return;e.requestFullscreen({navigationUI:'hide'}).then(function(){if(screen.orientation&&screen.orientation.lock){screen.orientation.lock('landscape').catch(function(){});}}).catch(function(){});},{passive:true});
</script>"

